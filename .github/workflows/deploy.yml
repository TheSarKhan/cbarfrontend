name: Frontend (Admin & Cashier) CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies & Typecheck
        run: |
          npm ci
          npm run typecheck

      - name: Deploy Admin Panel to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete --exclude=.git --exclude=.github --exclude=node_modules --exclude=.next ./ "$VPS_USER@$VPS_HOST:/opt/cbar/apps/admin/"
          ssh "$VPS_USER@$VPS_HOST" "cd /opt/cbar && docker compose up -d --build --wait --wait-timeout 180 admin && curl -fsS http://127.0.0.1:18081 >/dev/null"

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          COMMIT_MSG=$(git log -1 --pretty=%s)
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            --data-urlencode "text=🖥 <b>Kampus Admin & Kassa (cbarfrontend) Deploy</b>
          Status: <b>${STATUS}</b>
          Commit: <code>${GITHUB_SHA::7}</code> — ${COMMIT_MSG}
          URL: https://cbar.sarkhan.az" >/dev/null
